<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- Bauhaus Modernist Geometric Field -->
    <rect width="64" height="64" fill="#f3ecdd" stroke="#17130f" stroke-width="3"/>
    
    <!-- Quadrant Color Accent: Cobalt Blue -->
    <path d="M 32 32 L 61 32 A 29 29 0 0 0 32 3 Z" fill="#2c4bc4"/>
    
    <!-- Optical Lens Outer Ring -->
    <circle cx="32" cy="32" r="22" fill="none" stroke="#17130f" stroke-width="2.5"/>
    
    <!-- Precision Crosshairs -->
    <line x1="32" y1="5" x2="32" y2="15" stroke="#17130f" stroke-width="2.5" stroke-linecap="square"/>
    <line x1="32" y1="49" x2="32" y2="59" stroke="#17130f" stroke-width="2.5" stroke-linecap="square"/>
    <line x1="5" y1="32" x2="15" y2="32" stroke="#17130f" stroke-width="2.5" stroke-linecap="square"/>
    <line x1="49" y1="32" x2="59" y2="32" stroke="#17130f" stroke-width="2.5" stroke-linecap="square"/>
    
    <!-- Central Pupil & Vermilion Accent -->
    <circle cx="32" cy="32" r="11" fill="#17130f"/>
    <circle cx="32" cy="32" r="5" fill="#f3ecdd"/>
    <circle cx="21" cy="43" r="3.5" fill="#e2452b"/>
</svg>